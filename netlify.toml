# Netlify settings. There is no build step: Netlify publishes the ready-made site/ folder.
# Every commit to the main branch triggers a new production deploy.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
